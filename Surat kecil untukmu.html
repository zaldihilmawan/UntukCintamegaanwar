<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surat kecil untukmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#1f1030; --plum:#3a1f52; --blush:#f4c2cc; --rose:#e98fa5; --pearl:#fbf1ec; --gold:#e0b985; --text:#f6e9ee;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0;min-height:100%;font-family:var(--sans);color:var(--text);
  background:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 12%,#fff7 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 46%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 72%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 64% 84%,#fff7 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 38%,#fff5 50%,transparent 51%),
    radial-gradient(900px 520px at 50% -8%,#53306f 0%,transparent 62%),
    var(--ink);
  background-color:#1f1030;
  overflow-x:hidden;
}
#float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fh{position:absolute;bottom:-40px;color:var(--rose);opacity:.0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.35}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}

main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px 20px}
.scene{display:none;width:100%;max-width:520px;flex-direction:column;align-items:center;text-align:center;gap:22px}
.scene.on{display:flex;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1,h2{font-family:var(--serif);font-weight:600;margin:0;line-height:1.1}
.sub{margin:0;color:#d9c3d0;font-size:.98rem}

/* Envelope */
.env{
  all:unset;cursor:pointer;position:relative;width:min(300px,78vw);aspect-ratio:3/2;
  border-radius:10px;background:linear-gradient(180deg,#f9dfe4,#f1b9c5);
  box-shadow:0 24px 60px #0007,0 0 0 1px #ffffff22 inset;
}
.env:focus-visible,.btn:focus-visible,.ghost:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.env .flap{
  position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#f7d1d9,#eba5b4);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:3;border-radius:10px 10px 0 0;
}
.env .pocket{
  position:absolute;inset:0;border-radius:10px;z-index:2;
  background:
    linear-gradient(to top right,transparent 49.5%,#00000010 50%) left/50% 100% no-repeat,
    linear-gradient(to top left,transparent 49.5%,#00000010 50%) right/50% 100% no-repeat;
}
.env .seal{
  position:absolute;left:50%;top:52%;translate:-50% -50%;z-index:4;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff9cb3,#c9435f);display:grid;place-items:center;color:#fff;font-size:22px;
  box-shadow:0 4px 10px #0005;transition:opacity .3s;
}
.env .paper{position:absolute;left:8%;right:8%;top:8%;height:80%;background:var(--pearl);border-radius:6px;z-index:1;transition:transform .8s ease .35s}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .seal{opacity:0}
.env.open .paper{transform:translateY(-55%)}
.to{font-family:var(--serif);font-size:clamp(2rem,8vw,2.8rem)}
.hint{font-size:.92rem;color:#cdb2c2}

/* Letter */
.card{
  width:100%;background:var(--pearl);color:#3a2540;border-radius:14px;padding:30px 26px 24px;text-align:left;
  box-shadow:0 24px 60px #0008;min-height:300px;display:flex;flex-direction:column;gap:16px;
}
.card p{font-family:var(--serif);font-size:clamp(1.28rem,4.6vw,1.55rem);line-height:1.38;margin:0;animation:in .8s ease both}
.card p.hi{font-style:italic;color:#a23a58}
.card .sign{font-family:var(--serif);font-style:italic;text-align:right}
.btn{
  font:700 1rem var(--sans);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;color:#3a1230;
  background:linear-gradient(180deg,#ffd3dc,var(--rose));box-shadow:0 8px 22px #e98fa555;transition:transform .2s;
}
.btn:active{transform:scale(.97)}
.ghost{
  font:700 .98rem var(--sans);border:1.5px solid #ffffff55;background:transparent;color:var(--text);border-radius:999px;padding:13px 26px;cursor:pointer;
  transition:transform .2s;touch-action:manipulation;
}
.ask h2{font-size:clamp(2.4rem,10vw,3.5rem)}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:96px}
#iya{transform-origin:center;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:38px;color:#fff;background:radial-gradient(circle at 35% 30%,#ff9cb3,#c9435f);box-shadow:0 0 0 10px #e98fa522,0 0 0 22px #e98fa511}

.burst{position:fixed;z-index:5;pointer-events:none;color:var(--rose);animation:pop 1.9s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}

@media (prefers-reduced-motion:reduce){
  .fh,.burst{display:none}
  .scene.on,.card p{animation:none}
  .env .flap,.env .paper,#iya{transition:none}
}
</style>
</head>
<body>
<div id="float" aria-hidden="true"></div>
<main>

  <section class="scene on" id="s-env">
    <h1 class="to">Untuk <span id="nama1"></span></h1>
    <button class="env" id="env" aria-label="Buka surat">
      <span class="paper"></span><span class="flap"></span><span class="pocket"></span><span class="seal">♥</span>
    </button>
    <p class="hint">Ada surat kecil untukmu. Ketuk untuk membuka.</p>
  </section>

  <section class="scene" id="s-letter">
    <article class="card" id="card" aria-live="polite"></article>
    <button class="btn" id="next">Lanjut</button>
  </section>

  <section class="scene ask" id="s-ask">
    <h2>Maukah kamu jadi pacarku?</h2>
    <div class="row" id="row">
      <button class="btn" id="iya">Iya, mau</button>
      <button class="ghost" id="tidak">Tidak</button>
    </div>
    <p class="sub" id="note">Pikirkan baik-baik. Aku sabar menunggu.</p>
  </section>

  <section class="scene" id="s-yes">
    <div class="ring">♥</div>
    <h2>Terima kasih, <span id="nama2"></span>.</h2>
    <p class="sub" style="font-size:1.1rem;max-width:30ch">Kamu baru saja membuat hari ini jadi hari terbaikku.</p>
    <a class="btn" id="wa" href="#" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Kirim kabar ke <span id="kamu"></span> lewat WhatsApp</a>
    <p class="sub">Kalau WhatsApp tidak terbuka sendiri, ketuk tombol di atas.</p>
  </section>

</main>
<script>
/* Ubah dua nama ini sesuai kebutuhan */
var NAMA_DIA = "Cinta Mega Anwar";
var NAMA_KAMU = "Zall";
/* Nomor WhatsApp tujuan, format internasional tanpa + (contoh: 6281234567890) */
var NOMOR_WA = "6283127375667";
var PESAN_WA = "Aku terima kamu";
function waUrl(){
  return "https://wa.me/" + String(NOMOR_WA).replace(/\D/g,"") + "?text=" + encodeURIComponent(PESAN_WA);
}

var LINES = [
  ["Hai, " + NAMA_DIA + ".", "hi"],
  ["Aku sudah beberapa kali menulis ulang surat ini supaya terdengar keren & bagus. Ujungnya, aku pilih jujur saja."],
  ["Sejak ketemu dengan kamu, hariku terasa lebih ringan. Hal sekecil balasan chat darimu bisa membuatku senyum sendiri."],
  ["Aku suka caramu tertawa, caramu peduli, dan caramu menjadi dirimu sendiri."],
  ["Jadi, aku hanya ingin bertanya satu hal."],
  ["— " + NAMA_KAMU, "sign"]
];
var DODGE = ["Tidak","Yakin?","Coba pikir lagi","Jangan begitu dong","Tombolnya capek","Sekali lagi?","Ya sudah, iya"];

var $ = function(id){return document.getElementById(id)};
$("nama1").textContent = NAMA_DIA; $("nama2").textContent = NAMA_DIA; $("kamu").textContent = NAMA_KAMU;

function show(id){
  document.querySelectorAll(".scene").forEach(function(s){s.classList.remove("on")});
  $(id).classList.add("on");
}

/* Hati melayang di latar */
(function(){
  var box = $("float");
  for(var i=0;i<14;i++){
    var h = document.createElement("span");
    h.className = "fh"; h.textContent = "♥";
    h.style.left = (Math.random()*100)+"%";
    h.style.fontSize = (10+Math.random()*16)+"px";
    h.style.animationDuration = (14+Math.random()*14)+"s";
    h.style.animationDelay = (-Math.random()*20)+"s";
    box.appendChild(h);
  }
})();

/* Amplop */
$("env").addEventListener("click", function(){
  this.classList.add("open");
  setTimeout(function(){ show("s-letter"); addLine(); }, 1500);
}, {once:true});

/* Surat */
var idx = 0;
function addLine(){
  var l = LINES[idx++], p = document.createElement("p");
  p.textContent = l[0]; if(l[1]) p.className = l[1];
  $("card").appendChild(p);
  if(idx >= LINES.length){ $("next").textContent = "Aku siap menjawab"; }
}
$("next").addEventListener("click", function(){
  if(idx < LINES.length){ addLine(); } else { show("s-ask"); }
});

/* Tombol Tidak yang menghindar */
var tries = 0, tidak = $("tidak"), iya = $("iya");
function dodge(e){
  if(e) e.preventDefault();
  tries++;
  if(tries >= DODGE.length - 1){
    tidak.textContent = DODGE[DODGE.length-1];
    tidak.style.position = ""; tidak.style.left = ""; tidak.style.top = "";
    tidak.removeEventListener("pointerenter", dodge);
    tidak.removeEventListener("click", dodge);
    tidak.addEventListener("click", yes);
    iya.style.transform = "scale(1.1)";
    $("note").textContent = "Tombol itu sudah menyerah. Kamu juga boleh.";
    return;
  }
  tidak.textContent = DODGE[tries];
  var w = tidak.offsetWidth, h = tidak.offsetHeight, pad = 16;
  var x = pad + Math.random()*(window.innerWidth - w - pad*2);
  var y = pad + Math.random()*(window.innerHeight - h - pad*2);
  tidak.style.position = "fixed"; tidak.style.left = x+"px"; tidak.style.top = y+"px"; tidak.style.zIndex = 4;
  iya.style.transform = "scale(" + (1 + tries*0.09) + ")";
}
tidak.addEventListener("pointerenter", dodge);
tidak.addEventListener("click", dodge);

/* Jawaban Iya */
function yes(){
  show("s-yes");
  var url = waUrl();
  $("wa").href = url;
  setTimeout(function(){ window.open(url, "_blank", "noopener"); }, 1800);
  for(var i=0;i<42;i++){
    var b = document.createElement("span");
    b.className = "burst"; b.textContent = "♥";
    b.style.left = (window.innerWidth/2)+"px"; b.style.top = (window.innerHeight*0.4)+"px";
    b.style.fontSize = (14+Math.random()*26)+"px";
    var a = Math.random()*Math.PI*2, d = 120+Math.random()*Math.min(window.innerWidth,520)*0.6;
    b.style.setProperty("--dx", Math.cos(a)*d+"px");
    b.style.setProperty("--dy", Math.sin(a)*d+"px");
    b.style.setProperty("--r", (Math.random()*120-60)+"deg");
    b.style.color = i%3===0 ? "#e0b985" : "#e98fa5";
    document.body.appendChild(b);
    (function(el){setTimeout(function(){el.remove()},2000)})(b);
  }
}
iya.addEventListener("click", yes);
</script>
</body>
</html>
